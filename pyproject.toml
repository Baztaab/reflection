[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "ravi-vedic"
version = "0.1.0"
description = "Canonical calculation kernel for RAVI VEDIC"
requires-python = ">=3.11"
dependencies = [
  "pyswisseph==2.10.3.2",
  "tzdata==2026.4",
]

[project.optional-dependencies]
dev = [
  "jsonschema==4.26.0",
  "pytest==9.1.1",
  "ruff==0.16.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ravi_vedic"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]
