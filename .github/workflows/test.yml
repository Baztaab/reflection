name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: ruff check src tests scripts
      - run: pytest
      - name: Check out frozen pre-M2.6 core
        uses: actions/checkout@v7
        with:
          ref: c12308f50ef2959f6ccdd4c95afd4bc7a171ee2e
          path: .baseline
      - name: Verify exact pre/post-refactor payload parity
        run: python scripts/verify_foundation_parity.py .baseline .
