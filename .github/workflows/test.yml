name: quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]
    env:
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - run: ruff check src tests scripts
      - run: mypy src/ravi_vedic
      - run: pytest
      - name: Check out frozen pre-M2.6 core
        uses: actions/checkout@v7
        with:
          ref: c12308f50ef2959f6ccdd4c95afd4bc7a171ee2e
          path: .baseline
      - name: Verify exact pre/post-refactor payload parity
        run: python scripts/verify_foundation_parity.py .baseline .
